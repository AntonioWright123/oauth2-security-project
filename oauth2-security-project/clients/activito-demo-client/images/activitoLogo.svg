     stroke-width="15" stroke-linecap="round" stroke-linejoin="round">
    <path d="M177 75a29 29 0 1 0 0 48"/>
    <path d="M212 48v70q0 10 12 10"/><path d="M196 74h34"/>
    <path d="M250 76v52"/>
    <path d="M272 70l20 58 20-58"/>
    <path d="M332 76v52"/>
    <path d="M356 48v70q0 10 12 10"/><path d="M340 74h34"/>
    <circle cx="410" cy="99" r="29"/>
  </g>
  <g transform="skewX(-4) translate(-26 0)" fill="#ffffff">
    <circle cx="250" cy="52" r="8"/><circle cx="332" cy="52" r="8"/>
  </g>
</svg>
