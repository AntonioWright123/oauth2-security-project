<!DOCTYPE html>
<html>
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activito OAuth Callback</title>
    <link rel="stylesheet" href="./css/callback.css">
</head>

</head>
<body>
    <div class="callback-card">
        <h1>Activito OAuth Callback</h1>
        <p id="status">Processing OAuth callback...</p>
    </div>

    <script>
    // Handles the OAuth server redirect back to Activito.
    function handleOAuthCallback() {
        const params = new URLSearchParams(window.location.search);

        const code = params.get("code");
        const error = params.get("error");
        const errorDescription = params.get("error_description");

        const statusElement = document.getElementById("status");

        // OAuth server returned an error.
        if (error) {
            statusElement.textContent =
                `Error: ${errorDescription || error}`;
            return;
        }

        // Authorization server returned a code.
        if (code) {
            statusElement.textContent =
                "Authorization successful!";

            console.log("Authorization code:", code);

            // Next step:
            // send this code to the backend /token endpoint.
            return;
        }

        statusElement.textContent =
            "No authorization code found in the callback.";
    }

    window.onload = handleOAuthCallback;
</script>
</body>
</html>
